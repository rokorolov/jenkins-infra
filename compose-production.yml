services:
    caddy:
        image: caddy:2.11.6-alpine
        restart: always
        ports:
            - "80:80"
            - "443:443"
            - "443:443/udp"
        volumes:
            # Directory mount: Ansible replaces the Caddyfile atomically, which a
            # single-file bind mount would not pick up.
            - /etc/jenkins/caddy:/etc/caddy:ro
            - caddy-data:/data
            - caddy-config:/config
        healthcheck:
            test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        depends_on:
            - jenkins
        logging: &logging
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

    jenkins:
        build:
            context: ./docker/common/jenkins
        restart: always
        environment:
            JENKINS_AGENT_EXECUTORS: ${JENKINS_AGENT_EXECUTORS:-2}
        volumes:
            - jenkins-data:/var/jenkins_home
            - agent-keys:/etc/jenkins-agent-keys:ro
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8080/login || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 120s
        depends_on:
            agent-keys:
                condition: service_completed_successfully
        logging: *logging

    agent:
        build:
            context: ./docker/common/agent
        restart: always
        environment:
            DOCKER_HOST: tcp://docker:2376
            DOCKER_CERT_PATH: /certs/client
            DOCKER_TLS_VERIFY: 1
        volumes:
            - agent-keys:/etc/jenkins-agent-keys:ro
            - agent-workspace:/home/jenkins/agent
            - docker-certs:/certs/client:ro
        depends_on:
            agent-keys:
                condition: service_completed_successfully
            docker:
                condition: service_started
        logging: *logging

    # Generates the controller-to-agent SSH key pair once per installation.
    agent-keys:
        build:
            context: ./docker/common/agent
        entrypoint: ["generate-agent-key"]
        user: jenkins
        volumes:
            - agent-keys:/etc/jenkins-agent-keys
        logging: *logging

    docker:
        image: docker:29.6.1-dind
        restart: always
        privileged: true
        environment:
            DOCKER_TLS_CERTDIR: /certs
        volumes:
            - /etc/docker/dind-daemon.json:/etc/docker/daemon.json:ro
            # Same path as in the agent, so pipelines can bind-mount their workspace.
            - agent-workspace:/home/jenkins/agent
            - docker-certs:/certs/client
            - docker-data:/var/lib/docker
        healthcheck:
            test: ["CMD", "docker", "-H", "unix:///var/run/docker.sock", "info"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s
        logging: *logging

volumes:
    jenkins-data:
    agent-workspace:
    agent-keys:
    docker-certs:
    docker-data:
    caddy-data:
    caddy-config:
