---
-   name: Add authorized key
    hosts: manager
    remote_user: root
    tasks:
        -   name: Add user authorized key
            ansible.posix.authorized_key:
                user: deploy
                key: "{{ lookup('file', item) }}"
            with_first_found:
                - "~/.ssh/id_ed25519.pub"
                - "~/.ssh/id_ecdsa.pub"
                - "~/.ssh/id_rsa.pub"
