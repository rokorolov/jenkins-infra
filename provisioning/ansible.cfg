[defaults]
interpreter_python = auto_silent
host_key_checking = False

[ssh_connection]
# ~/.ssh is mounted read-only from the host. SSH refuses config files it doesn't
# own (-F /dev/null) and cannot write to known_hosts, so known hosts are
# discarded (/dev/null) instead of failing on the read-only mount.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -F /dev/null -o UserKnownHostsFile=/dev/null
