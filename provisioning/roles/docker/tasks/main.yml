---
-   name: Install and configure Docker
    become: true
    block:
        -   name: Install dependencies
            ansible.builtin.apt:
                name:
                    - ca-certificates
                    - curl
                    - python3-debian
                state: present
                update_cache: yes

        -   name: Create keyrings directory
            ansible.builtin.file:
                path: /etc/apt/keyrings
                state: directory
                mode: '0755'

        -   name: Add Docker GPG key
            ansible.builtin.get_url:
                url: https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg
                dest: /etc/apt/keyrings/docker.asc
                mode: '0644'
                force: true

        -   name: Remove legacy Docker APT list file
            ansible.builtin.file:
                path: /etc/apt/sources.list.d/docker.list
                state: absent

        -   name: Add Docker APT repository
            ansible.builtin.deb822_repository:
                name: docker
                types: deb
                uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
                suites: "{{ ansible_facts['distribution_release'] }}"
                components: stable
                architectures: "{{ ansible_facts['architecture'] | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}"
                signed_by: /etc/apt/keyrings/docker.asc
                state: present

        -   name: Install Docker Engine and Compose plugin
            ansible.builtin.apt:
                name:
                    - docker-ce
                    - docker-ce-cli
                    - containerd.io
                    - docker-buildx-plugin
                    - docker-compose-plugin
                state: present
                update_cache: yes

        -   name: Ensure Docker is running and enabled at boot
            ansible.builtin.service:
                name: docker
                state: started
                enabled: yes

-   name: Set periodic Docker prune
    become: true
    ansible.builtin.cron:
        name: docker-prune
        job: 'docker system prune -af --filter until=72h'
        minute: '0'
        hour: '1'

-   name: Remove useless packages and dependencies
    become: true
    ansible.builtin.apt:
        autoclean: yes
        autoremove: yes
