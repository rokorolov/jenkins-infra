---
-   name: Generate SSH keypair for controller-to-agent connections
    delegate_to: localhost
    become: false
    run_once: true
    ansible.builtin.command:
        cmd: ssh-keygen -t ed25519 -f {{ agent_ssh_key_path }} -N "" -C jenkins-agent
        creates: "{{ agent_ssh_key_path }}"

-   name: Install Java runtime and Git
    become: true
    ansible.builtin.apt:
        name:
            - default-jre-headless
            - git
        state: present
        update_cache: yes

-   name: Create Jenkins agent user
    become: true
    ansible.builtin.user:
        name: "{{ agent_user }}"
        groups: docker
        shell: /bin/bash
        create_home: yes
        state: present

-   name: Create agent remote root directory
    become: true
    ansible.builtin.file:
        path: "{{ agent_home }}/agent"
        state: directory
        owner: "{{ agent_user }}"
        group: "{{ agent_user }}"
        mode: '0755'

-   name: Authorize the Jenkins controller's SSH key
    become: true
    ansible.posix.authorized_key:
        user: "{{ agent_user }}"
        key: "{{ lookup('file', agent_ssh_key_path ~ '.pub') }}"
