---
-   name: Upgrade and Maintain System
    hosts: all
    remote_user: root
    tasks:
        -   name: Update, upgrade, and clean APT packages
            ansible.builtin.apt:
                update_cache: yes
                upgrade: dist
                autoclean: yes
                autoremove: yes

        -   name: Check if reboot is required
            ansible.builtin.stat:
                path: /var/run/reboot-required
            register: reboot_required

        -   name: Reboot if kernel was upgraded
            ansible.builtin.reboot:
            when: reboot_required.stat.exists and (reboot | default(false) | bool)

        -   name: Warn about pending reboot
            ansible.builtin.debug:
                msg: "A reboot is required to finish the upgrade. Run: make upgrade REBOOT=true"
            when: reboot_required.stat.exists and not (reboot | default(false) | bool)
